name: Build StrengthSMP

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract source
        run: |
          mkdir project
          unzip -o StrengthSMP-Android-Build.zip -d project
          find project -name build.gradle

      - name: Build plugin
        run: |
          DIR=$(dirname "$(find project -name build.gradle | head -n 1)")
          cd "$DIR"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: StrengthSMP-plugin
          path: project/**/build/libs/*.jar
          if-no-files-found: error
